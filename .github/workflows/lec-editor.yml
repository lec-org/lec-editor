name: line

on:
  push:
    branches: [main, lec-editor-baseline]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows 重定向日志默认使用西文编码，中文输出需显式使用 UTF-8。
  PYTHONUTF8: "1"

concurrency:
  group: lec-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c-runner:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: macos-26
            platform: aarch64-macos
          - os: windows-2022
            platform: x86_64-windows
    runs-on: ${{ matrix.os }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Rust
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: 检查工具链脚本
        run: python -m unittest discover -s script -p 'test_lec_toolchain.py'
      - name: 构建运行器
        run: cargo +1.98.1 build --locked -p c_runner --bin lec-run
      - name: 准备内置工具链
        run: python script/lec-toolchain.py install ${{ matrix.platform }} target/debug/toolchains/zig
      - name: 验证无系统编译器的运行环境
        shell: bash
        run: python script/lec-toolchain.py check "target/debug/lec-run${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: 准备内置调试器
        run: python script/lec-toolchain.py install-debugger ${{ matrix.platform }} target/debug/toolchains/codelldb
      - name: 验证 C/C++ 断点、变量和单步
        shell: bash
        run: python script/check-lec-debugger.py "target/debug/lec-run${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: 验证 C/C++ 编译运行
        run: cargo +1.98.1 test --locked -p c_runner
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: lec-windows
          cache-on-failure: true
      - name: Check fork boundaries and translations
        run: python script/check-lec.py
      - name: Validate installer syntax and identity
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'lec-installer-check'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Set-Content (Join-Path $stage 'leceditor.exe') 'installer syntax check only'
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' "/DSourceDir=$stage" "/DOutputDir=$stage" '/DAppVersion=0.0.0' '/DArchitecture=x86_64' crates/zed/resources/windows/lec-editor.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test translations
        run: cargo +1.98.1 test --locked -p i18n
      - name: Test the Windows runner
        run: cargo +1.98.1 test --locked -p c_runner --lib
      - name: Check the Windows application
        run: cargo +1.98.1 check --locked --keep-going -p zed --bin leceditor
      - name: Test empty folder behavior
        run: cargo +1.98.1 test --locked -p project_panel empty_row
      - name: Test activity bar behavior
        run: cargo +1.98.1 test --locked -p workspace activity_bar_entries_and_toggle
